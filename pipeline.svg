<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 450" width="900" height="450">
  <rect width="100%" height="100%" fill="white"/>
  
  <!-- Title -->
  <text x="450" y="30" font-size="18" font-family="Arial, Helvetica, sans-serif" text-anchor="middle" font-weight="bold" fill="#1a1a2e">Local VCS — Object Storage Pipeline</text>

  <!-- Step 1: Working Directory -->
  <rect x="30" y="55" width="155" height="95" rx="10" fill="#3b82f6" stroke="#2563eb" stroke-width="2"/>
  <text x="107" y="78" font-size="11" font-family="Arial, sans-serif" text-anchor="middle" fill="white" font-weight="bold">Working Directory</text>
  <text x="107" y="95" font-size="8" font-family="Arial, sans-serif" text-anchor="middle" fill="#dbeafe">User edits files</text>
  <text x="107" y="108" font-size="8" font-family="Arial, sans-serif" text-anchor="middle" fill="#dbeafe">Source code changes</text>
  <text x="107" y="121" font-size="8" font-family="Arial, sans-serif" text-anchor="middle" fill="#dbeafe">Binary assets</text>
  <text x="107" y="134" font-size="8" font-family="Arial, sans-serif" text-anchor="middle" fill="#dbeafe">New/deleted files</text>

  <!-- Arrow -->
  <line x1="185" y1="102" x2="215" y2="102" stroke="#94a3b8" stroke-width="2" marker-end="url(#vcsparr)"/>
  <text x="200" y="96" font-size="7" font-family="Arial, sans-serif" text-anchor="middle" fill="#64748b">vcs add</text>

  <!-- Step 2: Index (Staging) -->
  <rect x="215" y="55" width="140" height="95" rx="10" fill="#8b5cf6" stroke="#7c3aed" stroke-width="2"/>
  <text x="285" y="78" font-size="11" font-family="Arial, sans-serif" text-anchor="middle" fill="white" font-weight="bold">Index (Staging)</text>
  <text x="285" y="95" font-size="8" font-family="Arial, sans-serif" text-anchor="middle" fill="#ede9fe">Binary index file</text>
  <text x="285" y="108" font-size="8" font-family="Arial, sans-serif" text-anchor="middle" fill="#ede9fe">Tracked file list</text>
  <text x="285" y="121" font-size="8" font-family="Arial, sans-serif" text-anchor="middle" fill="#ede9fe">SHA-1 per entry</text>
  <text x="285" y="134" font-size="8" font-family="Arial, sans-serif" text-anchor="middle" fill="#ede9fe">File metadata</text>

  <!-- Arrow -->
  <line x1="355" y1="102" x2="385" y2="102" stroke="#94a3b8" stroke-width="2" marker-end="url(#vcsparr)"/>
  <text x="370" y="96" font-size="7" font-family="Arial, sans-serif" text-anchor="middle" fill="#64748b">vcs commit</text>

  <!-- Step 3: Hash -->
  <rect x="385" y="55" width="130" height="95" rx="10" fill="#f59e0b" stroke="#d97706" stroke-width="2"/>
  <text x="450" y="78" font-size="11" font-family="Arial, sans-serif" text-anchor="middle" fill="white" font-weight="bold">SHA-1 Hash</text>
  <text x="450" y="95" font-size="8" font-family="Arial, sans-serif" text-anchor="middle" fill="#fef3c7">Custom inline SHA-1</text>
  <text x="450" y="108" font-size="8" font-family="Arial, sans-serif" text-anchor="middle" fill="#fef3c7">No OpenSSL dep</text>
  <text x="450" y="121" font-size="8" font-family="Arial, sans-serif" text-anchor="middle" fill="#fef3c7">hash = sha1(type</text>
  <text x="450" y="134" font-size="8" font-family="Arial, sans-serif" text-anchor="middle" fill="#fef3c7">    + size + data)</text>

  <!-- Arrow -->
  <line x1="515" y1="102" x2="545" y2="102" stroke="#94a3b8" stroke-width="2" marker-end="url(#vcsparr)"/>
  <text x="530" y="96" font-size="7" font-family="Arial, sans-serif" text-anchor="middle" fill="#64748b">compress</text>

  <!-- Step 4: Compress -->
  <rect x="545" y="55" width="120" height="95" rx="10" fill="#ec4899" stroke="#db2777" stroke-width="2"/>
  <text x="605" y="78" font-size="11" font-family="Arial, sans-serif" text-anchor="middle" fill="white" font-weight="bold">zlib</text>
  <text x="605" y="95" font-size="8" font-family="Arial, sans-serif" text-anchor="middle" fill="#fce7f3">Z_BEST_SPEED</text>
  <text x="605" y="108" font-size="8" font-family="Arial, sans-serif" text-anchor="middle" fill="#fce7f3">Gzip compression</text>
  <text x="605" y="121" font-size="8" font-family="Arial, sans-serif" text-anchor="middle" fill="#fce7f3">~60-70% reduction</text>
  <text x="605" y="134" font-size="8" font-family="Arial, sans-serif" text-anchor="middle" fill="#fce7f3">Cross-platform</text>

  <!-- Arrow -->
  <line x1="665" y1="102" x2="695" y2="102" stroke="#94a3b8" stroke-width="2" marker-end="url(#vcsparr)"/>
  <text x="680" y="96" font-size="7" font-family="Arial, sans-serif" text-anchor="middle" fill="#64748b">write</text>

  <!-- Step 5: Object Store -->
  <rect x="695" y="55" width="160" height="95" rx="10" fill="#10b981" stroke="#059669" stroke-width="2"/>
  <text x="775" y="78" font-size="11" font-family="Arial, sans-serif" text-anchor="middle" fill="white" font-weight="bold">Object Store</text>
  <text x="775" y="95" font-size="8" font-family="Arial, sans-serif" text-anchor="middle" fill="#d1fae5">.vcs/objects/</text>
  <text x="775" y="108" font-size="8" font-family="Arial, sans-serif" text-anchor="middle" fill="#d1fae5">ab/cdef1234...</text>
  <text x="775" y="121" font-size="8" font-family="Arial, sans-serif" text-anchor="middle" fill="#d1fae5">Loose objects</text>
  <text x="775" y="134" font-size="8" font-family="Arial, sans-serif" text-anchor="middle" fill="#d1fae5">Pack files (gc)</text>

  <!-- Object Types row -->
  <rect x="30" y="180" width="840" height="90" rx="10" fill="#fef3c7" stroke="#fde68a" stroke-width="2"/>
  <text x="450" y="200" font-size="12" font-family="Arial, sans-serif" text-anchor="middle" font-weight="bold" fill="#92400e">Object Types</text>
  
  <rect x="60" y="212" width="130" height="45" rx="6" fill="#f59e0b" stroke="#d97706" stroke-width="1.5"/>
  <text x="125" y="230" font-size="9" font-family="Arial, sans-serif" text-anchor="middle" fill="white" font-weight="bold">blob</text>
  <text x="125" y="245" font-size="7" font-family="Arial, sans-serif" text-anchor="middle" fill="#fef3c7">File content</text>
  
  <rect x="210" y="212" width="130" height="45" rx="6" fill="#f59e0b" stroke="#d97706" stroke-width="1.5"/>
  <text x="275" y="230" font-size="9" font-family="Arial, sans-serif" text-anchor="middle" fill="white" font-weight="bold">tree</text>
  <text x="275" y="245" font-size="7" font-family="Arial, sans-serif" text-anchor="middle" fill="#fef3c7">Directory listing</text>
  
  <rect x="360" y="212" width="130" height="45" rx="6" fill="#f59e0b" stroke="#d97706" stroke-width="1.5"/>
  <text x="425" y="230" font-size="9" font-family="Arial, sans-serif" text-anchor="middle" fill="white" font-weight="bold">commit</text>
  <text x="425" y="245" font-size="7" font-family="Arial, sans-serif" text-anchor="middle" fill="#fef3c7">Snapshot + metadata</text>
  
  <rect x="510" y="212" width="130" height="45" rx="6" fill="#f59e0b" stroke="#d97706" stroke-width="1.5"/>
  <text x="575" y="230" font-size="9" font-family="Arial, sans-serif" text-anchor="middle" fill="white" font-weight="bold">tag</text>
  <text x="575" y="245" font-size="7" font-family="Arial, sans-serif" text-anchor="middle" fill="#fef3c7">Named reference</text>
  
  <rect x="660" y="212" width="130" height="45" rx="6" fill="#f59e0b" stroke="#d97706" stroke-width="1.5"/>
  <text x="725" y="230" font-size="9" font-family="Arial, sans-serif" text-anchor="middle" fill="white" font-weight="bold">stash</text>
  <text x="725" y="245" font-size="7" font-family="Arial, sans-serif" text-anchor="middle" fill="#fef3c7">WIP snapshot</text>

  <!-- Branch / Merge row -->
  <rect x="30" y="295" width="415" height="140" rx="10" fill="#d1fae5" stroke="#a7f3d0" stroke-width="2"/>
  <text x="237" y="318" font-size="12" font-family="Arial, sans-serif" text-anchor="middle" font-weight="bold" fill="#065f46">Branching & Merge</text>
  
  <rect x="55" y="330" width="110" height="40" rx="6" fill="#10b981" stroke="#059669" stroke-width="1.5"/>
  <text x="110" y="355" font-size="9" font-family="Arial, sans-serif" text-anchor="middle" fill="white" font-weight="bold">refs/heads/</text>
  
  <rect x="180" y="330" width="110" height="40" rx="6" fill="#10b981" stroke="#059669" stroke-width="1.5"/>
  <text x="235" y="355" font-size="9" font-family="Arial, sans-serif" text-anchor="middle" fill="white" font-weight="bold">HEAD pointer</text>
  
  <rect x="305" y="330" width="110" height="40" rx="6" fill="#10b981" stroke="#059669" stroke-width="1.5"/>
  <text x="360" y="355" font-size="9" font-family="Arial, sans-serif" text-anchor="middle" fill="white" font-weight="bold">refs/tags/</text>
  
  <rect x="55" y="380" width="160" height="40" rx="6" fill="#059669" stroke="#047857" stroke-width="1.5"/>
  <text x="135" y="405" font-size="9" font-family="Arial, sans-serif" text-anchor="middle" fill="white" font-weight="bold">Fast-forward merge</text>
  
  <rect x="230" y="380" width="160" height="40" rx="6" fill="#059669" stroke="#047857" stroke-width="1.5"/>
  <text x="310" y="405" font-size="9" font-family="Arial, sans-serif" text-anchor="middle" fill="white" font-weight="bold">3-way merge</text>

  <!-- Refs row -->
  <rect x="465" y="295" width="405" height="140" rx="10" fill="#fce7f3" stroke="#fbcfe8" stroke-width="2"/>
  <text x="667" y="318" font-size="12" font-family="Arial, sans-serif" text-anchor="middle" font-weight="bold" fill="#9d174d">Ref Resolution</text>
  
  <rect x="490" y="330" width="175" height="40" rx="6" fill="#ec4899" stroke="#db2777" stroke-width="1.5"/>
  <text x="577" y="355" font-size="9" font-family="Arial, sans-serif" text-anchor="middle" fill="white" font-weight="bold">HEAD → branch → commit</text>
  
  <rect x="490" y="380" width="175" height="40" rx="6" fill="#ec4899" stroke="#db2777" stroke-width="1.5"/>
  <text x="577" y="405" font-size="9" font-family="Arial, sans-serif" text-anchor="middle" fill="white" font-weight="bold">tag → commit (annotated)</text>
  
  <rect x="680" y="330" width="175" height="90" rx="6" fill="#db2777" stroke="#be185d" stroke-width="1.5"/>
  <text x="767" y="355" font-size="9" font-family="Arial, sans-serif" text-anchor="middle" fill="white" font-weight="bold">Log traversal</text>
  <text x="767" y="372" font-size="7" font-family="Arial, sans-serif" text-anchor="middle" fill="#fce7f3">Walk parent chain</text>
  <text x="767" y="385" font-size="7" font-family="Arial, sans-serif" text-anchor="middle" fill="#fce7f3">--oneline format</text>
  <text x="767" y="398" font-size="7" font-family="Arial, sans-serif" text-anchor="middle" fill="#fce7f3">--graph display</text>

  <!-- Arrow marker -->
  <defs>
    <marker id="vcsparr" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#94a3b8"/>
    </marker>
  </defs>
</svg>